version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 16

  pre_build:
    commands:
      # 登录到 Amazon ECR（请确保 IAM 权限允许）
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 148097737392.dkr.ecr.ap-northeast-1.amazonaws.com

  build:
    commands:
      - echo Build started on `date`
      # 安装依赖
      - npm install
      - echo npm install completed on `date`
      # 构建项目
      - npm run build
      - echo npm run build completed on `date`

      # 设置 TAG 为当前时间，确保镜像版本唯一
      - TAG=`date +%Y%m%d%H%M%S`
      - echo $TAG > imageTag.txt                 # ✅ 保存 TAG 到文件
      # 构建 Docker 镜像
      - docker build -t 148097737392.dkr.ecr.ap-northeast-1.amazonaws.com/my-ecr-2025:$TAG .
      - echo docker build completed on `date`
      # 推送镜像到 ECR
      - docker push 148097737392.dkr.ecr.ap-northeast-1.amazonaws.com/my-ecr-2025:$TAG
      - echo docker push completed on `date`

  post_build:
    commands:
      - echo Build completed on `date`
      - TAG=$(cat imageTag.txt)                 # ✅ 从文件中读取 TAG
      # 生成 ECS 用的 imageDefinitions.json 文件
      - printf '[{"name":"mynginx","imageUri":"%s"}]' 148097737392.dkr.ecr.ap-northeast-1.amazonaws.com/my-ecr-2025:$TAG > imageDefinitions.json
      - echo "==== imageDefinitions.json 内容 ===="
      - cat imageDefinitions.json
      - echo "==== 当前目录下的文件列表 ===="
      - ls -lh

artifacts:
  files:
    - imageDefinitions.json
    - imageTag.txt
